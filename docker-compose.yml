services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CUTOFF_TIME=${CUTOFF_TIME:-17:00}
      # ELEXON_LIVE=1 fetches live from Elexon at startup; default (unset)
      # serves the shipped snapshot, which is recommended.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - api
